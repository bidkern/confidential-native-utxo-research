name: Rust checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Formatting
        run: cargo +1.98.1 fmt --all -- --check
      - name: Tests
        run: cargo +1.98.1 test --locked --workspace
      - name: Lints
        run: cargo +1.98.1 clippy --locked --workspace --all-targets -- -D warnings
      - name: Economics scenarios
        run: python compatibility/economics.py
      - name: Isolated Ristretto comparator (not consensus integration)
        run: cargo +1.98.1 run --locked --release --manifest-path experiments/bulletproofs/Cargo.toml
      - name: Prepare pinned historical secp256k1 experiment
        run: |
          . ./experiments/secp256k1-bulletproofs/fetch.ps1
          "CNU_BP_SOURCE=$env:CNU_BP_SOURCE" >> $env:GITHUB_ENV
      - name: Check isolated secp256k1 adapter
        run: |
          cargo +1.98.1 fmt --manifest-path experiments/secp256k1-bulletproofs/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.98.1 clippy --locked --release --manifest-path experiments/secp256k1-bulletproofs/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.98.1 test --locked --release --manifest-path experiments/secp256k1-bulletproofs/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.98.1 run --locked --release --manifest-path experiments/secp256k1-bulletproofs/Cargo.toml
