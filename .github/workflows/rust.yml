name: Rust checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Formatting
        run: cargo +1.98.1 fmt --all -- --check
      - name: Tests
        run: cargo +1.98.1 test --locked --workspace
      - name: Lints
        run: cargo +1.98.1 clippy --locked --workspace --all-targets -- -D warnings
      - name: Economics scenarios
        run: python compatibility/economics.py
      - name: Isolated Ristretto comparator (not consensus integration)
        run: cargo +1.98.1 run --locked --release --manifest-path experiments/bulletproofs/Cargo.toml
