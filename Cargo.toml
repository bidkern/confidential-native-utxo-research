[workspace]
resolver = "2"
members = ["crates/keys", "crates/address", "crates/receiver_scan", "crates/commitments", "crates/proofs", "crates/confidential_tx", "crates/utxo", "crates/consensus_sim", "crates/core_bridge"]

[workspace.dependencies]
secp256k1-zkp = "=0.11.0"
sha2 = "0.10"
hkdf = "0.12"
bitcoin = "0.32"
k256 = "0.13"
bech32 = "0.9"
aes-gcm-siv = "0.11"
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
serde_json = "1"
keys = { path = "crates/keys" }
address = { path = "crates/address" }
commitments = { path = "crates/commitments" }
proofs = { path = "crates/proofs" }
confidential_tx = { path = "crates/confidential_tx" }
receiver_scan = { path = "crates/receiver_scan" }
utxo = { path = "crates/utxo" }
